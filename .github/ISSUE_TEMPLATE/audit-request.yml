name: Founding audit request
description: Request scope confirmation before paying for an Android release audit.
title: "Audit request: "
labels: ["audit-request"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private source code, credentials, customer data, or unpublished security details here. This issue only confirms scope; a private transfer method is agreed afterward.
  - type: input
    id: project
    attributes:
      label: Project summary
      description: Public app URL or a short non-confidential description.
      placeholder: Consumer Android app with one app module
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Approximate source size
      options:
        - Under 10,000 lines
        - 10,000 to 30,000 lines
        - Over 30,000 lines
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Desired delivery date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: concerns
    attributes:
      label: Main release concerns
      description: Describe the areas that need attention without disclosing sensitive details.
      placeholder: R8 regressions, WebView hardening, Play release configuration
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Payment and scope
      options:
        - label: I will wait for written scope acceptance before sending payment.
          required: true
        - label: I understand this is a static review, not a penetration test or security certification.
          required: true

