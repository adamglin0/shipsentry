name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    name: Scanner / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n scan.sh test.sh
      - name: Run regression tests
        run: ./test.sh

  action:
    name: Composite action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: shipsentry
        uses: ./
        with:
          project-directory: sample
          report-path: action-report.md
      - name: Verify action report
        env:
          REPORT_PATH: ${{ steps.shipsentry.outputs.report-path }}
        run: |
          test "$REPORT_PATH" = "action-report.md"
          grep -q '| 2 | 4 | 2 | 8 |' "$REPORT_PATH"

